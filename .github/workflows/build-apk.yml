# Ajouts Miah — compile l'APK automatiquement à chaque modification
# et le publie dans l'onglet « Releases » du dépôt (téléchargeable depuis le téléphone).
name: Construire l'APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :uhabits-android:assembleRelease

      - name: Renommer l'APK
        run: |
          mkdir -p out
          cp uhabits-android/build/outputs/apk/release/*.apk "out/Habitudes-plus-${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Habitudes-plus-apk
          path: out/*.apk

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Habitudes+ (version ${{ github.run_number }})
          body: |
            Télécharge le fichier .apk ci-dessous depuis ton téléphone puis ouvre-le pour l'installer.
          files: out/*.apk
